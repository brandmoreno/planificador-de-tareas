<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>

    <nav class="navbar bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="/img/doable-icon-512.png" alt="Logo" width="60" height="60"
                    class="d-inline-block align-text-top">
                DOABLE
            </a>
        </div>
    </nav>

    <div class="grid text-center grid-cols-4">
        <div>
            <div class="card" style="max-width: 310px;">
                <form id="submit">
                    <div class="card-body">
                        <h4 class="card-title">Título de la tarea</h4>

                        <div class="form-field">
                            <label for="fieldText" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="fieldText" placeholder="Ej. enviar correo ">
                        </div>

                        <div class="form-field">
                            <label for="fieldTextarea" class="form-label">Descripción</label>
                            <textarea class="form-control" id="fieldTextarea" rows="3"
                                placeholder="Agrega los detalles "></textarea>
                        </div>

                        <div class="container text-center">
                            <div class="row align-items-start">
                                <div class="col">
                                    <div class="form-field">
                                        <label for="fieldTextAsigned" class="form-label">Asignado a:</label>
                                        <input type="text" class="form-control" id="fieldTextAsigned"
                                            placeholder="Nombre de la persona">
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="form-field">
                                        <label for="fieldTextFecha" class="form-label">Fecha de entrega</label>
                                        <input type="date" class="form-control" id="fieldTextFecha"
                                            placeholder="dd/mm/aaaa">
                                    </div>
                                </div>
                                <div class="form-field">
                                    <label for="fieldSelectEstado" class="form-label">Estado</label>
                                    <select class="form-control" id="fieldSelectEstado">
                                        <option value="" selected disabled >Selecciona un estado</option>
                                        <option value="POR HACER">POR HACER</option>
                                        <option value="EN PROCESO">EN PROCESO</option>
                                        <option value="REVISIÓN">REVISIÓN</option>
                                        <option value="HECHO">HECHO</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="estado"></div>
                    </div>
                    <div class="d-grid gap-2 col-11 mx-auto">
                        <button class="btn-solid theme-inverse" type="submit">Agregar una tarea</button>
                    </div>
                </form>
                <p> </p>
            </div>

        </div>
        <div id="taskContainer"></div>

    </div>




    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script type="module" src="./js/task1.js"></script>
    <script type="module" src="./js/task2.js"></script>
    <script type="module" src="./js/task3.js"></script>
</body>

</html>
